[pytest]
pythonpath = .
testpaths = tests
filterwarnings =
    # Third-party deprecation inside starlette's TestClient, not our code.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    # Python 3.14 deprecation inside FastAPI/Starlette 0.115 routing, not our code.
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning
