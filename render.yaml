# Render Blueprint — public demo on Render's free tier (BT3 optional deployment).
# Steps, URLs and limits: docs/deployment-guide.md §9. The local package (docker compose)
# does not use this file.
#
# Secrets are never written here: JWT_SECRET is generated by Render, DEMO_PASSWORD is typed
# in the Render dashboard when the Blueprint is created, and the database password reaches
# the API only inside DATABASE_URL, on Render's private network.

databases:
  - name: l4-237480201is09-db
    plan: free                      # expires 30 days after creation (+14 days grace)
    region: singapore
    postgresMajorVersion: "16"
    databaseName: mekong_l4
    user: mekong_l4
    ipAllowList: []                 # no public access: only Render services can connect

services:
  # FastAPI, built from the same Dockerfile as docker compose; its start-up runs
  # migrate.py → seed.py (both safe to re-run) → uvicorn on Render's $PORT.
  - type: web
    name: l4-237480201is09-api
    runtime: docker
    plan: free                      # sleeps after 15 min without traffic; wakes in about 1 min
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: l4-237480201is09-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true         # random 256-bit value, kept across restarts
      - key: DEMO_PASSWORD
        sync: false                 # asked for in the dashboard; only its hash is stored
      - key: CORS_ORIGINS
        value: https://l4-237480201is09-web.onrender.com
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: APP_TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: DB_CONNECT_TIMEOUT
        value: "10"
      - key: LOG_LEVEL
        value: INFO

  # React UI as a static site (free, served from Render's CDN, does not sleep).
  - type: web
    name: l4-237480201is09-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL      # read by Vite at build time
        value: https://l4-237480201is09-api.onrender.com
      - key: NODE_VERSION           # Vite 8 needs Node 20.19+ / 22.12+
        value: 22.14.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
