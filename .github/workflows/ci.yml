# Runs the whole test suite on a clean machine on every push and pull request:
# install from the lock files, then the same commands as README §5.
name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16.4-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password   # throw-away CI database, not a secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: mekong_l4
      DB_USER: postgres
      DB_PASSWORD: ci-only-password
      REQUIRE_DB: "1"            # database cases must run, not be skipped
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: pytest -q -rs

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.14.0", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
