# Whole system in containers: PostgreSQL (db) + FastAPI (api) + React/nginx (web).
#   cp .env.example .env
#   docker compose up -d --build
# Web: http://localhost:5173   API: http://localhost:8000/health
name: mekong-l4

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-mekong_l4}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Host port 5433 by default so it does not clash with a local PostgreSQL on 5432.
    ports:
      - "${DOCKER_DB_PORT:-5433}:5432"

  api:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mekong_l4}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-5173},http://127.0.0.1:${WEB_PORT:-5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy   # wait until PostgreSQL accepts connections
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:${API_PORT:-8000}
    depends_on:
      api:
        condition: service_healthy   # uses the HEALTHCHECK in ./Dockerfile
    ports:
      - "${WEB_PORT:-5173}:8080"

volumes:
  db_data:
